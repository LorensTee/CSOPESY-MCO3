---
name: ci
# The three-OS matrix is the only proof that the WIN32/POSIX source split
# still compiles on the platforms nobody here can hold.
on: [push, pull_request]
jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      # No lukka/get-cmake: the hosted runners already ship CMake >= 3.21.
      - uses: actions/checkout@v4
      # Explicit `bash`, because the Windows default shell is pwsh.
      - name: Layer guard
        run: bash scripts/check_layers.sh
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build --config Debug
      - name: Test
        run: ctest --test-dir build -C Debug --output-on-failure
